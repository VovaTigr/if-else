<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If-Else</title>
</head>
<body>
    <h1>bebebebebebe</h1>
    <button onclick="checkSquaredNumber()">Check Squared Number</button>
    <button onclick="checkCubedNumber()">Check Cubed Number</button><br>
    <button onclick='perimeter(prompt("Enter the length of the rectangle"), prompt("Enter the width of the rectangle"));' style="margin-top: 15px;">Check Perimeter</button>
    <button onclick='area(prompt("Enter the length of the rectangle"), prompt("Enter the width of the rectangle"));' style="margin-top: 15px;">Check Area</button><br>
    <button onclick="checkFactorial()" style="margin-top: 15px;">Check Factorial of a Number</button>
    <button onclick='recursiveFactorial(prompt("Enter a number to check its factorial"))' style="margin-top: 15px;">Check Recursive Factorial</button>
    <script src="script.js"></script>
</body>
</html>
